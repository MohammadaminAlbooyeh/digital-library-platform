server:
  port: 0

spring:
  application:
    name: digital-library-platform
  datasource:
    url: jdbc:h2:mem:dlp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
    redis-repositories:
      enabled: false
    web:
      redis:
        enabled: false
  kafka:
    bootstrap-servers: ""

app:
  jwt:
    secret: ${JWT_SECRET:test-secret-for-jwt-at-least-32-bytes-long-xyz}
    expiration-ms: 3600000   # 1 hour for tests
    refresh-expiration-ms: 7200000   # 2 hours for tests
  aws:
    s3:
      region: us-east-1
      bucket: test-bucket
      access-key: test
      secret-key: test
      cdn-base-url: http://localhost:8080
  drm:
    encryption-key: 0123456789abcdef0123456789abcdef
    license-ttl-hours: 48
  delivery:
    streaming-chunk-size: 1048576

springdoc:
  swagger-ui:
    enabled: false
