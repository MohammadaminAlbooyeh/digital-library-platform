# Production configuration.
# All sensitive values MUST be supplied via environment variables.
# Never commit real credentials to the repository.

server:
  port: ${PORT:8080}

spring:
  application:
    name: digital-library-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dlp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:dlp}
    password: ${DB_PASSWORD:dlp}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: dlp-reading
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-for-hs256-at-least-32-bytes}
    expiration-ms: 86400000   # 24 hours
  aws:
    s3:
      region: ${AWS_REGION:us-east-1}
      bucket: ${S3_BUCKET:dlp-content}
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
      cdn-base-url: ${CDN_BASE_URL:https://cdn.example.com}
  drm:
    encryption-key: ${DRM_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
    license-ttl-hours: 48
  delivery:
    streaming-chunk-size: 1048576

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
